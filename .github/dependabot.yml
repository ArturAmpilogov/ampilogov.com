# Dependabot version updates. Security updates are turned on in the repository
# settings and open PRs as soon as an advisory applies, regardless of this schedule.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # pnpm packages (Dependabot reads pnpm-lock.yaml through the npm ecosystem).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait a few days before proposing a new release, so a compromised or broken
    # publish is usually pulled before it reaches a PR. Security updates are not delayed.
    cooldown:
      default-days: 3
    groups:
      # One PR for all minor and patch updates; each major version gets its own PR.
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  # Versions of the actions used in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
